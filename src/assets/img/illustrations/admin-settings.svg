<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Large gear background -->
  <g transform="translate(150, 100)" opacity="0.12">
    <path d="M80 0 L90 25 L115 25 L95 42 L105 68 L80 52 L55 68 L65 42 L45 25 L70 25Z" fill="white" transform="scale(2.5) translate(-80,-35)"/>
  </g>

  <!-- Small gear -->
  <g transform="translate(380, 70)" opacity="0.15">
    <circle cx="0" cy="0" r="25" fill="none" stroke="white" stroke-width="8"/>
    <circle cx="0" cy="0" r="10" fill="rgba(255,255,255,0.2)"/>
    <rect x="-4" y="-32" width="8" height="12" rx="3" fill="white"/>
    <rect x="-4" y="20" width="8" height="12" rx="3" fill="white"/>
    <rect x="-32" y="-4" width="12" height="8" rx="3" fill="white"/>
    <rect x="20" y="-4" width="12" height="8" rx="3" fill="white"/>
    <rect x="15" y="-27" width="8" height="12" rx="3" fill="white" transform="rotate(45 19 -21)"/>
    <rect x="-27" y="15" width="8" height="12" rx="3" fill="white" transform="rotate(45 -23 21)"/>
    <rect x="15" y="15" width="8" height="12" rx="3" fill="white" transform="rotate(-45 19 21)"/>
    <rect x="-27" y="-27" width="8" height="12" rx="3" fill="white" transform="rotate(-45 -23 -21)"/>
  </g>

  <!-- Monitor/Dashboard -->
  <rect x="60" y="120" width="160" height="110" rx="10" fill="rgba(255,255,255,0.15)"/>
  <rect x="70" y="130" width="140" height="85" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="115" y="230" width="50" height="8" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="100" y="238" width="80" height="5" rx="3" fill="rgba(255,255,255,0.1)"/>

  <!-- Dashboard content -->
  <rect x="80" y="140" width="50" height="8" rx="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="80" y="155" width="120" height="20" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="80" y="182" width="35" height="25" rx="4" fill="rgba(45,206,137,0.4)"/>
  <rect x="122" y="182" width="35" height="25" rx="4" fill="rgba(94,114,228,0.4)"/>
  <rect x="164" y="182" width="35" height="25" rx="4" fill="rgba(251,99,64,0.4)"/>

  <!-- Body -->
  <rect x="310" y="190" width="100" height="130" rx="22" fill="#2d3748"/>

  <!-- Head -->
  <circle cx="360" cy="162" r="48" fill="#f4c28f"/>

  <!-- Hair short -->
  <path d="M312 155 Q312 108 360 103 Q408 108 408 155 Q408 135 395 128 Q375 120 360 122 Q345 120 325 128 Q312 135 312 155Z" fill="#1a202c"/>

  <!-- Eyes -->
  <circle cx="344" cy="158" r="5" fill="#333"/>
  <circle cx="376" cy="158" r="5" fill="#333"/>
  <circle cx="346" cy="156" r="2" fill="white"/>
  <circle cx="378" cy="156" r="2" fill="white"/>

  <!-- Glasses -->
  <rect x="330" y="148" width="28" height="20" rx="5" stroke="#666" stroke-width="2.5" fill="none"/>
  <rect x="362" y="148" width="28" height="20" rx="5" stroke="#666" stroke-width="2.5" fill="none"/>
  <line x1="358" y1="158" x2="362" y2="158" stroke="#666" stroke-width="2.5"/>

  <!-- Smile -->
  <path d="M348 178 Q360 188 372 178" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Tie -->
  <polygon points="360,215 352,235 360,260 368,235" fill="#e53e3e"/>

  <!-- Arm pointing to monitor -->
  <path d="M310 240 Q270 220 225 200" stroke="#f4c28f" stroke-width="16" fill="none" stroke-linecap="round"/>
  <circle cx="222" cy="198" r="8" fill="#f4c28f"/>

  <!-- Other arm on hip -->
  <path d="M410 240 Q440 260 430 290" stroke="#f4c28f" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Legs -->
  <rect x="335" y="320" width="18" height="55" rx="9" fill="#2d3748"/>
  <rect x="370" y="320" width="18" height="55" rx="9" fill="#2d3748"/>

  <!-- Shoes -->
  <ellipse cx="344" cy="378" rx="18" ry="9" fill="#1a202c"/>
  <ellipse cx="379" cy="378" rx="18" ry="9" fill="#1a202c"/>

  <!-- Shield icon floating -->
  <g transform="translate(430, 180)" opacity="0.2">
    <path d="M0 -20 L18 -10 L18 8 Q18 25 0 32 Q-18 25 -18 8 L-18 -10Z" fill="white"/>
    <path d="M-6 2 L-2 8 L8 -4" stroke="rgba(0,0,0,0.4)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decoration -->
  <text x="100" y="100" font-size="18" fill="rgba(255,255,255,0.15)">✦</text>
  <text x="450" y="280" font-size="14" fill="rgba(255,255,255,0.12)">✦</text>
  <text x="300" y="100" font-size="10" fill="rgba(255,255,255,0.1)">✦</text>
</svg>
