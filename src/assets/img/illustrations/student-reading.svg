<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Thought bubble -->
  <ellipse cx="380" cy="80" rx="60" ry="45" fill="rgba(255,255,255,0.15)"/>
  <ellipse cx="340" cy="140" rx="18" ry="14" fill="rgba(255,255,255,0.12)"/>
  <ellipse cx="320" cy="170" rx="10" ry="8" fill="rgba(255,255,255,0.1)"/>

  <!-- Math symbols in bubble -->
  <text x="360" y="75" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.5)" font-weight="bold">π</text>
  <text x="390" y="90" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.4)">+</text>
  <text x="370" y="100" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.4)">∑</text>
  <text x="395" y="70" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.35)">×</text>

  <!-- Body -->
  <rect x="220" y="200" width="90" height="120" rx="20" fill="#5e72e4"/>

  <!-- Head -->
  <circle cx="265" cy="175" r="45" fill="#f4c28f"/>

  <!-- Hair -->
  <path d="M220 170 Q220 125 265 120 Q310 125 310 170 Q310 155 295 150 Q280 145 265 148 Q250 145 235 150 Q220 155 220 170Z" fill="#8B4513"/>
  <path d="M218 175 Q215 155 225 145" stroke="#8B4513" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M312 175 Q315 155 305 145" stroke="#8B4513" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="250" cy="172" r="5" fill="#333"/>
  <circle cx="280" cy="172" r="5" fill="#333"/>
  <circle cx="252" cy="170" r="2" fill="white"/>
  <circle cx="282" cy="170" r="2" fill="white"/>

  <!-- Smile -->
  <path d="M252 190 Q265 200 278 190" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Glasses -->
  <circle cx="250" cy="172" r="12" stroke="#555" stroke-width="2.5" fill="none"/>
  <circle cx="280" cy="172" r="12" stroke="#555" stroke-width="2.5" fill="none"/>
  <line x1="262" y1="172" x2="268" y2="172" stroke="#555" stroke-width="2.5"/>

  <!-- Arms holding book -->
  <path d="M220 240 Q190 260 200 300" stroke="#f4c28f" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M310 240 Q340 260 330 300" stroke="#f4c28f" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Book -->
  <rect x="185" y="285" width="160" height="100" rx="5" fill="#4299e1"/>
  <line x1="265" y1="285" x2="265" y2="385" stroke="white" stroke-width="2"/>
  <rect x="195" y="295" width="60" height="4" rx="2" fill="rgba(255,255,255,0.5)"/>
  <rect x="195" y="305" width="50" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="195" y="315" width="55" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="275" y="295" width="60" height="4" rx="2" fill="rgba(255,255,255,0.5)"/>
  <rect x="275" y="305" width="45" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="275" y="315" width="55" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>

  <!-- Legs -->
  <rect x="235" y="320" width="20" height="60" rx="10" fill="#4a5568"/>
  <rect x="275" y="320" width="20" height="60" rx="10" fill="#4a5568"/>

  <!-- Shoes -->
  <ellipse cx="245" cy="385" rx="18" ry="10" fill="#333"/>
  <ellipse cx="285" cy="385" rx="18" ry="10" fill="#333"/>

  <!-- Star decorations -->
  <text x="150" y="160" font-size="20" fill="rgba(255,255,255,0.2)">✦</text>
  <text x="400" y="200" font-size="16" fill="rgba(255,255,255,0.15)">✦</text>
  <text x="180" y="250" font-size="12" fill="rgba(255,255,255,0.12)">✦</text>
</svg>
